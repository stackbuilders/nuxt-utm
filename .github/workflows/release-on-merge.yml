name: Release on Merge

on:
  push:
    branches: [main]
    paths:
      # Triggers on version bump; the check-release job decides what is still missing
      - 'package.json'
  # Finishes a release whose tag or npm publish did not complete
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-release:
    # Manual runs can target any branch, but only main may release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      create_release: ${{ steps.check.outputs.create_release }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check what the version still needs
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists, skipping the GitHub Release"
            echo "create_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "create_release=true" >> "$GITHUB_OUTPUT"
          fi

          if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "$NAME@$VERSION is already on npm, skipping the publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check-release
    if: needs.check-release.outputs.create_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-release.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes

  publish:
    needs: check-release
    if: needs.check-release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing exchanges this OIDC token for a short-lived publish token
      id-token: write
    steps:
      - uses: actions/checkout@v6

      # Trusted publishing needs npm 11.5.1 or later, bundled since Node 24.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare module types
        run: pnpm dev:prepare

      - name: Build
        run: pnpm dev:build

      - name: Prepack
        run: pnpm run prepack

      - name: Publish to NPM
        run: npm publish
