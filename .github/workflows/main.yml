name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        node-version: [22, 24, 26]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: pnpm exec playwright-core install chromium

      - run: pnpm lint --max-warnings 0

      - name: Prepare module types
        run: pnpm dev:prepare

      - name: Check types
        run: pnpm test:types

      - name: Validate published package types
        run: pnpm test:package

      - name: Build Playground
        run: pnpm dev:build

      - name: Execute tests
        run: pnpm test

      - name: Build playground from the workspace
        run: pnpm --dir playground build

  compatibility:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nuxt-version: ['3', '4']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm dev:prepare
      - name: Test packed module in a generated static site
        run: pnpm test:compatibility
        env:
          NUXT_VERSION: ${{ matrix.nuxt-version }}
          NUXT_TELEMETRY_DISABLED: '1'
